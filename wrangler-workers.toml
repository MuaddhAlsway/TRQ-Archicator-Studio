name = "trq-api"
main = "server/worker.js"
compatibility_date = "2024-01-15"
account_id = "232c79d5cf0d169fca731d24966d5690"
workers_dev = true

# Environment variables
[env.production]
name = "trq-api-prod"
# Routes will be handled by Cloudflare DNS - no zone routing needed
# Worker is accessible at: https://trq-api-prod.muaddhalsway.workers.dev

[env.staging]
name = "trq-api-staging"
# Routes will be handled by Cloudflare DNS
# Worker is accessible at: https://trq-api-staging.muaddhalsway.workers.dev

# Bindings for environment variables
[env.production.vars]
# Secrets are now managed via: wrangler secret put TURSO_AUTH_TOKEN --env production
# wrangler secret put JWT_SECRET --env production
# This keeps sensitive data out of version control

[env.staging.vars]
# Secrets are now managed via: wrangler secret put TURSO_AUTH_TOKEN --env staging
# wrangler secret put JWT_SECRET --env staging

# Build configuration
[build]
command = "npm run build:worker"
cwd = "./"

# Observability
[observability]
enabled = true
