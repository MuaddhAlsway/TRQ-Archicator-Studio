services:
  - type: web
    name: trq-express-api
    env: node
    plan: free
    buildCommand: cd server && npm install
    startCommand: cd server && npm start
    envVars:
      - key: PORT
        value: 4242
      - key: NODE_ENV
        value: production
      - key: CORS_ORIGINS
        value: https://trq-studio-7ie.pages.dev,https://production.trq-studio-7ie.pages.dev
